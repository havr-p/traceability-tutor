spring:
  application:
    name: traceability-tutor
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:6543/ttutor}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
    dbcp2:
      max-wait-millis: 30000
      validation-query: select 1
      validation-query-timeout: 30
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, public_repo
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
springdoc:
  pathsToMatch: /api/**, /auth/**


app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration:
      minutes: ${APP_JWT_EXPIRATION_MINUTES:100}
  oauth2:
    redirectUri: http://localhost:4200/oauth2/redirect
  cors:
    allowed-origins:
      http://localhost:4200,
      https://traceability-tutor.vercel.app

jasypt.encryptor.password: ${JASYPT_ENCRYPTOR_PASSWORD}